name: Checks

on:
  push:
    branches: ["trunk"]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ">=24.14.1"

      - run: npm ci
      - run: npm run check
      - run: npm run test
